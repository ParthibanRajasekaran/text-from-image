name: Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
      
      - name: Check performance budgets
        run: npm run check:budgets
      
      - name: Check for new legacy-shims imports (non-blocking warning)
        if: always()
        run: npm run check-legacy-shims

      - name: Verify security headers in vercel.json
        run: node -e "const v=JSON.parse(require('fs').readFileSync('vercel.json','utf8')); if(!v.headers?.length){console.error('❌ CSP missing in vercel.json');process.exit(1);} console.log('✅ Security headers found');"

      - name: Guard raw innerHTML on user content
        run: |
          VIOLATIONS=$(grep -rn '\.innerHTML\s*=' --include="*.tsx" --include="*.ts" --exclude-dir=node_modules --exclude="*.spec.*" --exclude="*.test.*" . 2>/dev/null | grep -v 'JSON.stringify' | grep -v '//.*innerHTML' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Potential XSS vulnerabilities (innerHTML without sanitization):"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "✅ No dangerous innerHTML patterns found"
          fi
      
      - name: Upload Vitest coverage (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      
      - name: Print test summary
        if: always()
        run: |
          echo "## ✅ CI — Test & Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Test Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ✅ Cached & Installed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✅ See logs for details" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 [View full workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
