# Example only: copy it to .github/workflows/ in your own project and adjust.
# RenderCheck needs no secrets and no network access beyond installing dependencies and the browser.
name: ui-text-assertions
on: [push, pull_request]

# RENDERCHECK_REPORT_DIR makes failed assertions leave a record for the action below.
env:
  RENDERCHECK_REPORT_DIR: rendercheck-report

jobs:
  rendercheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/rendercheck/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: packages/rendercheck
      - run: npx playwright install --with-deps chromium
        working-directory: packages/rendercheck
      - run: npm run test:example
        working-directory: packages/rendercheck
      # Annotates the pull request with what was on screen and where, and uploads the screenshots with
      # the failing text outlined. `if: always()` so it runs after a failed test step.
      - uses: ParthibanRajasekaran/text-from-image/packages/rendercheck/action@foundation/phase-1
        if: always()
        with:
          report-dir: packages/rendercheck/rendercheck-report
